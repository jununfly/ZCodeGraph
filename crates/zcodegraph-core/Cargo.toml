[package]
name = "zcodegraph-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dhat = { version = "0.3", optional = true }
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.24"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"

[features]
default = []
dhat = ["dep:dhat"]

[lib]
name = "zcodegraph_core"
path = "src/lib.rs"

[[bin]]
name = "zcodegraph-core"
path = "src/main.rs"
