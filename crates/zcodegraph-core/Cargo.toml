[package]
name = "zcodegraph-core"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dhat = { version = "0.3", optional = true }
libc = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.24"
tree-sitter-c = "0.23"
# 0.23.5 jumped to tree-sitter ^0.25 / parser ABI 15, which tree-sitter 0.24
# rejects (LanguageError{version:15}). 0.23.1 is the ABI-14 build pinned to
# ^0.24, matching every other grammar here and the TS-side vendored wasm.
tree-sitter-c-sharp = "=0.23.1"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.23"
# fwcd has not published a tree-sitter 0.24-compatible release to crates.io
# yet (0.3.8 pins tree-sitter >=0.21, <0.23). Main is 0.4.0 via
# tree-sitter-language 0.1 and builds against tree-sitter 0.24; pin the rev
# until a 0.4.x is published. Verified ABI-compatible (LANGUAGE.into()).
tree-sitter-kotlin = { git = "https://github.com/fwcd/tree-sitter-kotlin", rev = "1852ea17b7f60fb3f9d84e0b1555d56b46b39fb1" }
# Lua (roadmap 1-2-12-1). MunifTanjim/tree-sitter-lua. PINNED to =0.2.0: it is
# the last ABI-14 release, bridging into the workspace's tree-sitter 0.24 via
# tree-sitter-language 0.1 (LANGUAGE.into()) exactly like tree-sitter-objc 3.0.
# 0.4.1 and 0.5.0 regenerated parser.c as ABI 15 and fail set_language with
# LanguageError{version:15}; 0.1.0 predates the LANGUAGE const. The extractor's
# node names + field labels match this grammar generation (node-types census +
# runtime SEXP probe); a deeper old/new-grammar multiset delta, if any, is
# gated on real corpora in roadmap 1-2-12-3 (fallback = regenerate an ABI-14
# parser from the TS-side grammar on a fork, the Dart rust-024 pattern).
tree-sitter-lua = "=0.2.0"
# Objective-C (roadmap 1-2-14-1). tree-sitter-grammars/tree-sitter-objc; 3.0.2
# declares tree-sitter-language ^0.1 + tree-sitter ^0.24(dev), bridging via
# LANGUAGE.into() exactly like tree-sitter-swift 0.6.0. ABI 14 verified by the
# grammar-wiring smoke test; the TS-side grammar is tree-sitter-objc.wasm in
# tree-sitter-wasms.
tree-sitter-objc = "3.0"
# Dart: crates.io tree-sitter-dart 0.0.4 is a stale ast-grep fork snapshot
# (2024-05) whose AST diverges from the grammar the TS side ships (9 node-shape
# diffs, 14 ERRORs on Dart 3). The production tree-sitter-dart.wasm
# (tree-sitter-wasms 0.1.13) is built from UserNobody14/tree-sitter-dart, but
# its master moved to ABI 15 / tree-sitter 0.25+ in Oct 2025 (rejected by
# tree-sitter 0.24, same LanguageError{version:15} class as the pinned
# tree-sitter-c-sharp 0.23.1). c1222f5 is the last ABI-14 commit; its AST is a
# byte-for-byte multiset match of the shipped wasm (0 ERROR on Dart 3). It
# declares tree-sitter = "0.22.6", which conflicts with the workspace's single
# tree-sitter 0.24 (native `links`), so pin our fork branch rust-024 whose
# only delta is the one-line dependency bump to 0.24 (grammar/parser.c
# unchanged, verified identical to the locally-built probe).
tree-sitter-dart = { git = "https://github.com/jununfly/tree-sitter-dart", rev = "03b552c516f2adb6e84c3858427f5fa0124b3d95" }
# 0.23.11 builds against tree-sitter ^0.24 (ABI 14), matching every other
# grammar here; LANGUAGE is the full grammar (PHP + inline HTML).
tree-sitter-php = "0.23"
tree-sitter-python = "0.23"
# 0.23.1 builds against tree-sitter ^0.24 (ABI 14), matching every other
# grammar here and the TS-side vendored wasm (tree-sitter-wasms 0.1.11).
tree-sitter-ruby = "0.23"
tree-sitter-rust = "0.23"
# alex-pinkus/tree-sitter-swift. PINNED to =0.6.0: it is the last ABI-14
# release, generated against tree-sitter 0.23 and bridged into this
# workspace's tree-sitter 0.24 via tree-sitter-language 0.1 (LANGUAGE.into()).
# Every 0.7.x (0.7.0..0.7.4) regenerated parser.c as ABI 15 and fails
# set_language with LanguageError{version:15} despite still declaring
# tree-sitter-language ^0.1 (that crate is a transparent ABI shim, it does
# NOT convert versions). 0.6.0 is the same grammar generation as the
# production tree-sitter-swift.wasm in tree-sitter-wasms 0.1.13 — its node
# shapes match (class/struct/enum all parse as class_declaration with an
# inner `struct`/`enum` keyword, enum_entry, protocol_function_declaration,
# value_binding_pattern), and a modern-Swift sample (async/throws, property
# wrappers incl. @Siblings(through:), closures, guard/if-let, actor,
# extension+opaque some View, associated-value enum cases, result builders)
# parses with zero ERROR nodes (roadmap 1-6-4-1). The external scanner is
# plain C built by `cc`.
tree-sitter-swift = "=0.6.0"
tree-sitter-typescript = "0.23"

[features]
default = []
dhat = ["dep:dhat"]

[lib]
name = "zcodegraph_core"
path = "src/lib.rs"

[[bin]]
name = "zcodegraph-core"
path = "src/main.rs"
