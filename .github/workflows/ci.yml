name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Required Rust indexing health gate for migration work: source build,
  # Rust core build/tests, packaged Rust discovery, SQLite/file-lock guardrails,
  # and release artifact contract coverage on Linux, macOS, and Windows.
  rust-packaged-path:
    name: Rust packaged path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2025]
    env:
      CODEGRAPH_ALLOW_UNSAFE_NODE: "1"
      CODEGRAPH_NO_DAEMON: "1"
      CODEGRAPH_NO_RELAUNCH: "1"
      # Pinned git grammar deps (e.g. jununfly/tree-sitter-dart) vendor
      # tree-sitter as a submodule fetched over SSH; make cargo delegate those
      # recursive fetches to the system git so the insteadOf rewrite below and
      # the runner's HTTPS credentials apply (libgit2's default transport does
      # not honour url.insteadOf).
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Redirect SSH submodule URLs to public HTTPS for cargo git deps
        shell: bash
        run: |
          # The pinned tree-sitter-dart fork's .gitmodules points its tree-sitter
          # submodule at git@github.com:tree-sitter/tree-sitter (SSH), but CI has
          # no SSH key, so the recursive cargo fetch fails to authenticate on all
          # three OSes. Rewrite the SSH URL to anonymous HTTPS (the submodule repo
          # is public); with CARGO_NET_GIT_FETCH_WITH_CLI the system git applies it.
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global --get-regexp 'url\..*\.insteadof'
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Build TypeScript CLI
        run: npm run build
      - name: Test Rust core
        run: cargo test
      - name: Build Rust core
        run: cargo build --package zcodegraph-core
      - name: Verify wave-0 rust-owned fixtures and skip-debt guardrails (#692)
        run: >
          npx vitest run
          tests/rust-owned-language-fixtures.test.ts
          tests/skip-debt-guardrail.test.ts
          tests/file-level-language-ownership-guard.test.ts
      - name: Verify wave-0 activated include, C++ free-function, inheritance, override, typed-pointer receiver, Java G7/G9 e2e, and cross-language cases (#692)
        run: >
          npx vitest run
          tests/extraction.test.ts
          tests/resolution.test.ts
          tests/frameworks-integration.test.ts
          tests/drupal.test.ts
          -t "resolves to the same-directory header, not a same-named one elsewhere|connects #include to the real header file via include-dir scan|does not link a static-member read across language families|links a type referenced only via a static field|links @Annotation usages to them|names a free function correctly when it has qualified-type params or a trailing return type|resolves base_class_clause bases into extends edges|bridges a base virtual method to the subclass override|resolves callers through typed object pointers|the call sits inside a return/declaration|creates a route->view edge from urls.py to view class on rust-hybrid|extracts stacked @bp.route nodes and resolves them to the view on rust-hybrid|extracts FastAPI @app.get/@app.post routes and resolves them to handlers on rust-hybrid|extracts OPTIONS/HEAD, Chi verbs, stdlib/gorilla ANY, and grouped routes|resolves cross-file C# calls, extends, instantiates, references, and imports on rust-hybrid after the ownership cutover|puts C# on the rust-owned side of the rust-hybrid plan after the ownership cutover|resolves references / instantiations of a record across files|controller routes and resolves them to Rust-extracted handlers on rust-hybrid|MapGet routes and resolves them to Rust-extracted handlers on rust-hybrid|keeps ASP.NET routes idempotent across a rust-hybrid close-and-reindex cycle|keeps Swift framework nodes idempotent across a rust-hybrid close-and-reindex cycle, roadmap 1-4-1-17~19|extracts Axum/Actix/Rocket routes and keeps them idempotent across close-and-reindex|extracts Spring/Express/Expo routes on rust-hybrid and keeps them idempotent across close-and-reindex|extracts Play conf/routes routes and resolves them to Rust-extracted controller actions on rust-hybrid|extracts app.METHOD, router.METHOD, inline-arrow calls, named-handler refs, and middleware chains on rust-hybrid|extracts all four transports \(HTTP / GraphQL / Microservice / WebSocket\) on rust-hybrid|extracts components, hooks, Route JSX, data-router objects, and Next.js file conventions on rust-hybrid|resolves cross-file PHP calls, implements, instantiates, references, and imports on rust-hybrid with use-import disambiguation, roadmap 1-2-5-3|routes PHP through the Rust core with zero TypeScript fallback after the ownership cutover, roadmap 1-2-5-4|extracts Route::get routes and resolves them to Rust-extracted controller methods on rust-hybrid|back-fills hook refs from Rust-indexed module files and keeps routing routes on rust-hybrid|links hooks declared in post update php files to other module implementations on rust-hybrid|links a hook ref in a post update php file to another module implementation|falls back to the exact hook template declared in an api php file|resolves cross-file Ruby superclass, mixin includes, instantiations, and qualified references on rust-hybrid before the ownership cutover, roadmap 1-2-6-3|routes Ruby through the Rust core with zero TypeScript fallback after the ownership cutover, roadmap 1-2-6-4|resolves cross-file Dart superclass, with-mixin, instantiations, and static/instance calls on rust-hybrid after the ownership cutover, roadmap 1-2-9-4|routes Dart through the Rust core with zero TypeScript fallback after the ownership cutover, roadmap 1-2-9-4|synthesizes expect->actual calls edges from the common declaration to every platform impl|extracts explicit and resources routes and resolves them to Rust-extracted controller actions on rust-hybrid|links a Fluent @Siblings through Pivot.self metatype to the pivot type on rust-hybrid, roadmap 1-6-4-5|links a @propertyWrapper usage to the wrapper type on rust-hybrid, roadmap 1-6-4-5|restores SwiftUI View/@main App nodes and a Vapor route -> handler edge on rust-hybrid, roadmap 1-6-4-5|routes Swift through the Rust core with zero TypeScript fallback after the ownership cutover, roadmap 1-6-4-5|back-fills RCT_EXPORT_MODULE/RCT_EXPORT_METHOD macro methods after the Rust cutover, roadmap 1-2-14-4|back-fills a legacy Paper ViewManager component \+ view props after the Rust cutover, roadmap 1-2-14-4|routes Objective-C \(\.m/\.mm and content-detected \.h\) through Rust with zero TypeScript fallback, roadmap 1-2-14-4|resolves a dotted cross-file Lua require and indexes functions/methods on rust-hybrid after the ownership cutover, roadmap 1-2-12-4|resolves a dotted cross-file Luau require and indexes typed signatures on rust-hybrid after the ownership cutover, roadmap 1-2-13-4|routes .luau through the Rust core with zero TypeScript fallback after the ownership cutover, roadmap 1-2-13-4|resolves cross-file Scala trait extends edges on rust-hybrid after the ownership cutover, roadmap 1-2-11-4|emits a calls ref for a C# event-subscription handler \(roadmap 1-2-12-2\)|emits a calls ref for a Python closure returned by name \(roadmap 1-2-12-2\)|resolves an unqualified generic call .FromHttpResponseMessage<T>. by its stripped name|resolves a receiver-qualified generic call .svc.Helper<int, string>.|does not strip non-call refs or names without a generic suffix"
      - name: Verify rust-hybrid CI smoke
        run: node scripts/rust-hybrid-ci-smoke.mjs
      - name: Verify Rust CLI engine paths
        run: >
          npx vitest run
          tests/rust-index-engine-cli-engine.test.ts
          tests/rust-index-engine-cli-failure-safety.test.ts
          -t "uses the rust-hybrid indexer by default|bootstraps an uninitialized project then indexes with rust-hybrid by default|runs the packaged Rust subprocess from a bundle layout without an env override|leaves the existing TypeScript index intact when the Rust binary is unavailable"
      - name: Verify SQLite and file-lock guardrails
        run: >
          npx vitest run
          tests/sqlite-backend.test.ts
          tests/concurrent-locking.test.ts
          tests/rust-index-engine-cli-failure-safety.test.ts
      - name: Verify visualize (self-contained HTML, isolated fixture)
        run: >
          npx vitest run
          tests/visualize.test.ts
          -t "renders a self-contained HTML at depth=file with fixture symbols inlined|exports monotonically more nodes as depth increases \(file < class < function\)|rejects an unsupported --depth value with a clear error|respects --max-nodes cap deterministically|visualize embeds full node data and a module/class/function view switcher for in-page switching"
      - name: Verify affected --pr blast radius (isolated git fixture)
        run: >
          npx vitest run
          tests/cli-affected-pr.test.ts
          -t "reports blast radius for --pr <A>\.\.<B> in JSON mode with source/test partition|emits a quiet stream usable for piping \(affected files only, one per line\)|fails cleanly when the git range is invalid|legacy mode \(no --pr\) still returns only test files for backward compatibility"
      - name: Verify health rubric + CLI (isolated fixture)
        run: >
          npx vitest run
          tests/health-rubric.test.ts
          tests/cli-health.test.ts
      - name: Verify dead-code rubric + CLI (isolated fixture, roadmap 1-2-5)
        run: >
          npx vitest run
          tests/dead-code.test.ts
          tests/cli-dead-code.test.ts
      - name: Verify complexity rubric + calculator + MCP surface (roadmap 1-2-6)
        run: >
          npx vitest run
          tests/metrics-complexity.test.ts
          tests/metrics-complexity-calculator.test.ts
          tests/mcp-complexity.test.ts
      - name: Verify badge SVG + CLI (isolated fixture)
        run: >
          npx vitest run
          tests/badge-svg.test.ts
          tests/cli-badge.test.ts
      - name: Verify churn (git log aggregation + CLI, isolated fixture)
        run: >
          npx vitest run
          tests/churn-aggregate.test.ts
          tests/cli-churn.test.ts
      - name: Verify index scope (agent work dirs excluded, isolated fixture)
        run: >
          npx vitest run
          tests/index-scope.test.ts
          tests/cli-index-scope.test.ts
      - name: Verify MCP progress notifications (roadmap 1-2-2)
        run: >
          npx vitest run
          tests/mcp-progress-notification.test.ts
          tests/mcp-progress-e2e.test.ts
      - name: Verify release artifact contracts
        run: >
          npx vitest run
          tests/release-workflow-rust-core.test.ts
          tests/rust-core-artifact-contract.test.ts
          tests/prepare-release.test.ts
          tests/extraction-version-contract.test.ts
          tests/ci-rust-packaged-path.test.ts

  # Roadmap 1-2-8 (横切：架构回归红线 + 能力健康探针).
  # Ubuntu-only on purpose: the committed reference baseline is produced on
  # ubuntu-24.04 (see docs/contracts/architecture-regression-baseline-v1.md);
  # Windows/macOS timing variance is governed by node 1-2-10, not the red line.
  # The corpus clone is cached across runs by actions/cache keyed on the
  # baseline artifact's pinned sha.
  architecture-red-lines:
    name: Architecture red lines + capability probes (ubuntu)
    runs-on: ubuntu-latest
    env:
      CODEGRAPH_ALLOW_UNSAFE_NODE: "1"
      CODEGRAPH_NO_DAEMON: "1"
      CODEGRAPH_NO_RELAUNCH: "1"
      MEASURE_GIT_PROTOCOL: "https"
      # Fresh-clone path on first run (empty cache), reused-clone hermetic
      # mode afterwards (see scripts/measure/lib/clone.mjs MEASURE_SKIP_FETCH).
      MEASURE_SKIP_FETCH: "1"
      # Same SSH-submodule redirect as the main job: cargo's tree-sitter-dart
      # fork vendors tree-sitter over SSH; CI has no SSH key (libgit2 ignores
      # url.insteadOf, hence CARGO_NET_GIT_FETCH_WITH_CLI).
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - uses: actions/checkout@v6
      - name: Redirect SSH submodule URLs to public HTTPS for cargo git deps
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Build TypeScript CLI
        run: npm run build
      - name: Build Rust core (upstream-check binary)
        run: cargo build --package zcodegraph-core
      - name: Restore measurement corpus cache
        uses: actions/cache@v4
        with:
          path: /tmp/measure-corpus
          key: measure-corpus-${{ hashFiles('docs/evidence/2026-10-22-architecture-regression-baseline.json') }}
          restore-keys: |
            measure-corpus-
      - name: Verify regression red-line verdict logic
        run: npx vitest run tests/perf-regression-check.test.ts
      - name: Verify architecture regression red lines (petclinic corpus)
        run: >
          node scripts/measure/perf-regression-check.mjs
          --baseline docs/evidence/2026-10-22-architecture-regression-baseline.json
          --corpus-root /tmp/measure-corpus
          --repetitions 3
      - name: Run capability probes (petclinic corpus)
        run: >
          node scripts/measure/capability-probes.mjs
          spring-projects/spring-petclinic
          --ref 500158f732419217507c7656904b8e6aa1bcc0d6
          --corpus-root /tmp/measure-corpus
          --out /tmp/capabilities.json
      - name: Doctor consumes capabilities.json with upstream check
        run: >
          node dist/bin/zcodegraph.js doctor /tmp/capabilities.json
          --upstream-check
      - name: Verify doctor capabilities e2e
        run: npx vitest run tests/cli-doctor-capabilities.test.ts
      # Roadmap 1-3-2: PR recall regression gate. Pins 6 PRs (2 per repo)
      # from the 1-1-5 baseline (recallUnionIndexable = 1.0 each) and fails
      # CI if any drops below max(0.85, baseline - 0.02) = 0.98. Reuses the
      # measure-corpus cache; per-PR base shas are fetched on demand with
      # --depth=1. The gate guards against regressions in the
      # ReferenceResolver / affected pipeline that the P-1 baseline did not
      # cover on a per-PR basis.
      - name: PR recall regression gate (3 repos × 2 pinned PRs)
        run: >
          node scripts/measure/pr-recall-gate.mjs
          --corpus-root /tmp/measure-corpus
