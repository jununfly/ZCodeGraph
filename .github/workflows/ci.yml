name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Required Rust indexing health gate for migration work: source build,
  # Rust core build/tests, packaged Rust discovery, SQLite/file-lock guardrails,
  # and release artifact contract coverage on Linux, macOS, and Windows.
  rust-packaged-path:
    name: Rust packaged path (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-2025]
    env:
      CODEGRAPH_ALLOW_UNSAFE_NODE: "1"
      CODEGRAPH_NO_DAEMON: "1"
      CODEGRAPH_NO_RELAUNCH: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install npm dependencies
        run: npm ci
      - name: Build TypeScript CLI
        run: npm run build
      - name: Test Rust core
        run: cargo test
      - name: Build Rust core
        run: cargo build --package zcodegraph-core
      - name: Verify wave-0 rust-owned fixtures and skip-debt guardrails (#692)
        run: >
          npx vitest run
          __tests__/rust-owned-language-fixtures.test.ts
          __tests__/skip-debt-guardrail.test.ts
      - name: Verify wave-0 activated include, C++ free-function, inheritance, override, typed-pointer receiver, Java G7/G9 e2e, cross-language cases, and rust-hybrid Python framework routes (#692, roadmap 1-6-2-4)
        run: >
          npx vitest run
          __tests__/extraction.test.ts
          __tests__/resolution.test.ts
          __tests__/frameworks-integration.test.ts
          -t "resolves to the same-directory header, not a same-named one elsewhere|connects #include to the real header file via include-dir scan|does not link a static-member read across language families|links a type referenced only via a static field|links @Annotation usages to them|names a free function correctly when it has qualified-type params or a trailing return type|resolves base_class_clause bases into extends edges|bridges a base virtual method to the subclass override|resolves callers through typed object pointers|the call sits inside a return/declaration|creates a route->view edge from urls.py to view class on rust-hybrid|extracts stacked @bp.route nodes and resolves them to the view on rust-hybrid|extracts FastAPI @app.get/@app.post routes and resolves them to handlers on rust-hybrid"
      - name: Verify rust-hybrid CI smoke
        run: node scripts/rust-hybrid-ci-smoke.mjs
      - name: Verify Rust CLI engine paths
        run: >
          npx vitest run
          __tests__/rust-index-engine-cli-engine.test.ts
          __tests__/rust-index-engine-cli-failure-safety.test.ts
          -t "uses the rust-hybrid indexer by default|bootstraps an uninitialized project then indexes with rust-hybrid by default|runs the packaged Rust subprocess from a bundle layout without an env override|leaves the existing TypeScript index intact when the Rust binary is unavailable"
      - name: Verify SQLite and file-lock guardrails
        run: >
          npx vitest run
          __tests__/sqlite-backend.test.ts
          __tests__/concurrent-locking.test.ts
          __tests__/rust-index-engine-cli-failure-safety.test.ts
      - name: Verify release artifact contracts
        run: >
          npx vitest run
          __tests__/release-workflow-rust-core.test.ts
          __tests__/rust-core-artifact-contract.test.ts
          __tests__/prepare-release.test.ts
          __tests__/extraction-version-contract.test.ts
          __tests__/ci-rust-packaged-path.test.ts
